name: Run JS Agent

on:
  deployment_status: # Dispara quando a Vercel conclui um deploy
    types: [success]
  workflow_dispatch:   # Permite rodar manualmente pelo GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Agent
        run: node path/to/your/agent.js
